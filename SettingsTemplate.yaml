body:
  - type: textBlock
    attributes:
      description: >-
        DualTran translates the text you type after the action keyword. Google works without a key;
        choose AI and pick a provider/model, then fill the API key.
  - type: dropdown
    attributes:
      name: engine
      label: Engine
      defaultValue: google
      options:
        - google
        - ai
  - type: dropdown
    attributes:
      name: target
      label: Target language
      description: BCP-47 language code.
      defaultValue: Chinese (Simplified) (zh-CN)
      options:
        - "English (en)"
        - "Chinese (Simplified) (zh-CN)"
        - "Chinese (Traditional) (zh-TW)"
        - "Japanese (ja)"
        - "Korean (ko)"
        - "Spanish (es)"
        - "French (fr)"
        - "German (de)"
        - "Italian (it)"
        - "Portuguese (pt)"
        - "Portuguese (Brazil) (pt-BR)"
        - "Russian (ru)"
        - "Arabic (ar)"
        - "Hindi (hi)"
        - "Bengali (bn)"
        - "Urdu (ur)"
        - "Persian (fa)"
        - "Turkish (tr)"
        - "Polish (pl)"
        - "Dutch (nl)"
        - "Swedish (sv)"
        - "Norwegian (no)"
        - "Danish (da)"
        - "Finnish (fi)"
        - "Czech (cs)"
        - "Slovak (sk)"
        - "Hungarian (hu)"
        - "Romanian (ro)"
        - "Bulgarian (bg)"
        - "Greek (el)"
        - "Hebrew (he)"
        - "Thai (th)"
        - "Vietnamese (vi)"
        - "Indonesian (id)"
        - "Malay (ms)"
        - "Ukrainian (uk)"
        - "Serbian (sr)"
        - "Croatian (hr)"
        - "Slovenian (sl)"
        - "Lithuanian (lt)"
        - "Latvian (lv)"
        - "Estonian (et)"
        - "Swahili (sw)"
        - "Filipino (tl)"
  - type: dropdown
    attributes:
      name: provider
      label: AI provider
      description: Single alphabetical list; Custom… is last.
      defaultValue: Select a provider
      options:
        - Select a provider
        - "Alibaba"
        - "Anthropic"
        - "Azure"
        - "Baidu"
        - "Cerebras"
        - "Cohere"
        - "Deep Infra"
        - "DeepSeek"
        - "Fireworks"
        - "Google"
        - "Groq"
        - "Hyperbolic"
        - "LMStudio"
        - "MiniMax (minimax.io)"
        - "Mistral"
        - "Moonshot AI"
        - "Novita"
        - "Nvidia"
        - "Ollama"
        - "OpenAI"
        - "OpenRouter"
        - "Perplexity"
        - "SambaNova"
        - "SiliconFlow"
        - "Together"
        - "Upstage"
        - "xAI"
        - "Zhipu AI"
        - "Custom…"
  - type: input
    attributes:
      name: endpoint
      label: API endpoint
      description: Leave empty to follow the selected provider.
      defaultValue: ""
  - type: input
    attributes:
      name: api_key
      label: API key
      description: Stored locally; sent only to the selected endpoint.
      defaultValue: ""
  - type: dropdown
    attributes:
      name: model
      label: Model
      description: Model list is shared because the platform template cannot cascade by provider.
      defaultValue: Select a model
      options:
        - Select a model
        - "Active Speaker Detection"
        - "Aion 3.5"
        - "Aion 3.5 Mini"
        - "Aion-2.0"
        - "ALLaM-2-7b"
        - "Aya Expanse 32B"
        - "Aya Vision 32B"
        - "bevformer"
        - "chatgpt-image-latest"
        - "Claude Fable 5"
        - "Claude Fable 5.1"
        - "Claude Fable 5.2"
        - "Codestral (latest)"
        - "Codestral 25.08"
        - "Command A"
        - "Cosmos Reason2 8B"
        - "Daybreak Blue"
        - "Daybreak Red"
        - "Deep Research Max Preview (Apr-21-2026)"
        - "Deep Research Preview (Apr-21-2026)"
        - "DeepSeek V3 0324"
        - "DeepSeek V4 Flash"
        - "DeepSeek V4 Flash 0731"
        - "DeepSeek V4 Flash Vision Exp"
        - "DeepSeek V4 Pro"
        - "DeepSeek V4.1 Flash 1017"
        - "deepseek-chat"
        - "Gemini 2.5 Computer Use Preview 10-2025"
        - "GLM-5.2"
        - "GPT OSS 120B"
        - "GPT OSS 20B"
        - "gpt-4.1"
        - "gpt-4o-mini"
        - "Kimi K2.6"
        - "Kimi K2.7 Code"
        - "Kimi K2.7 Code HighSpeed"
        - "Kimi K3"
        - "MiniMax-M2"
        - "MiniMax-M2.1"
        - "MiniMax-M2.5"
        - "Perplexity Sonar Deep Research"
        - "Qwen3 30B A3B 2507"
        - "Qwen3 Coder 30B"
        - "Qwen3.8 27B"
        - "Sonar"
  - type: dropdown
    attributes:
      name: reasoning
      label: Reasoning effort
      description: Lowest omits the field.
      defaultValue: lowest
      options:
        - lowest
        - low
        - medium
        - high
